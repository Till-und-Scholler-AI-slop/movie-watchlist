services:
  watchlist:
    build: .
    image: movie-watchlist:latest
    container_name: movie-watchlist
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - watchlist-data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production

volumes:
  watchlist-data:
